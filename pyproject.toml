[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fullstack-dev-skill"
version = "2.1.0"
description = "Install the Full-Stack Developer skill for Claude (or one of its focused packs) into Claude Code, or build a zip for the Claude app."
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jrnoorbaloch" }]
requires-python = ">=3.9"
keywords = ["claude", "claude-code", "claude-skill", "agent-skills", "fullstack", "gsap", "threejs", "wordpress", "remotion"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/jrnoorbaloch/fullstack-dev-skill"
Issues = "https://github.com/jrnoorbaloch/fullstack-dev-skill/issues"
Demos = "https://jrnoorbaloch.github.io/fullstack-dev-skill/"

[project.scripts]
fullstack-dev-skill = "fullstack_dev_skill.cli:main"

[tool.hatch.build.targets.sdist]
include = ["python/", "skills/", "packs/", "packs.json", "package.json", "LICENSE", "README.md"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["python/fullstack_dev_skill"]
exclude = ["**/node_modules", "**/__pycache__", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel.force-include]
"skills/fullstack-developer" = "fullstack_dev_skill/data/skills/fullstack-developer"
"packs" = "fullstack_dev_skill/data/packs"
"packs.json" = "fullstack_dev_skill/data/packs.json"
