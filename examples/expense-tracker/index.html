<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spendly — Simple expense tracker</title>
  <meta name="description" content="Track income and expenses, see where your money goes, export to CSV. Works offline in your browser." />
  <style>
    :root{--bg:#0b1020;--surface:#121a33;--surface-2:#18213f;--border:#24305a;--text:#e8ecff;--muted:#93a0c8;--primary:#7c8cff;--income:#34d399;--expense:#fb7185;--radius:14px}
    @media (prefers-color-scheme:light){:root{--bg:#f5f7ff;--surface:#fff;--surface-2:#eef1ff;--border:#dde3fb;--text:#151b33;--muted:#5d6890;--primary:#4f5bd5;--income:#059669;--expense:#e11d48}}
    *{box-sizing:border-box;margin:0}
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 64px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
    h1{font-size:1.5rem}h1 span{color:var(--primary)}
    .muted{color:var(--muted);font-size:.9rem}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
    .card .label{color:var(--muted);font-size:.85rem}
    .card .value{font-size:1.7rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
    .income{color:var(--income)}.expense{color:var(--expense)}
    .layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
    form{display:grid;gap:12px}
    label{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
    input,select{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
    .toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:4px;border:1px solid var(--border)}
    .toggle button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:8px;border-radius:8px;cursor:pointer}
    .toggle button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgb(0 0 0 / .2)}
    .btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
    .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:8px 12px;min-height:auto;font-weight:600}
    :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
    .error{color:var(--expense);font-size:.85rem;min-height:1.2em}
    .bars{display:grid;gap:10px;margin-top:6px}
    .bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:.9rem}
    .track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
    .fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
    .amount{text-align:end;font-variant-numeric:tabular-nums}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
    .toolbar input,.toolbar select{min-height:38px;padding:6px 10px}
    ul{list-style:none;padding:0}
    li.tx{display:grid;grid-template-columns:38px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border)}
    li.tx:last-child{border-bottom:0}
    .icon{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
    .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px;border-radius:8px}.del:hover{color:var(--expense)}
    .empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--border);border-radius:var(--radius)}
    h2{font-size:1rem;margin-bottom:12px}
    .stack{display:grid;gap:18px}
    @media (max-width:820px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 80px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>💸 <span>Spendly</span></h1>
        <p class="muted">Your money, at a glance. Data stays in this browser.</p>
      </div>
      <button class="btn secondary" id="exportBtn">⬇ Export CSV</button>
    </header>

    <section class="cards" aria-label="Summary">
      <div class="card"><div class="label">Balance</div><div class="value" id="balance">0</div></div>
      <div class="card"><div class="label">Income (this month)</div><div class="value income" id="income">0</div></div>
      <div class="card"><div class="label">Expenses (this month)</div><div class="value expense" id="expense">0</div></div>
    </section>

    <div class="layout">
      <div class="stack">
        <section class="card" aria-labelledby="addTitle">
          <h2 id="addTitle">Add transaction</h2>
          <form id="form" novalidate>
            <div class="toggle" role="group" aria-label="Type">
              <button type="button" data-type="expense" aria-pressed="true">Expense</button>
              <button type="button" data-type="income" aria-pressed="false">Income</button>
            </div>
            <label>Description<input id="desc" maxlength="80" placeholder="e.g. Groceries" required /></label>
            <label>Amount<input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required /></label>
            <label>Category<select id="category"></select></label>
            <label>Date<input id="date" type="date" required /></label>
            <p class="error" id="error" role="alert"></p>
            <button class="btn">Add</button>
          </form>
        </section>
        <section class="card" aria-labelledby="catTitle">
          <h2 id="catTitle">Spending by category (this month)</h2>
          <div class="bars" id="bars"></div>
        </section>
      </div>

      <section class="card" aria-labelledby="listTitle">
        <div class="toolbar">
          <h2 id="listTitle" style="margin:0">Transactions</h2>
          <div style="display:flex;gap:8px">
            <input id="search" placeholder="Search…" aria-label="Search transactions" />
            <select id="filter" aria-label="Filter by type"><option value="all">All</option><option value="expense">Expenses</option><option value="income">Income</option></select>
          </div>
        </div>
        <ul id="list" aria-live="polite"></ul>
      </section>
    </div>
  </div>

  <script>
    const CATS = { expense: { Food: "🍔", Transport: "🚌", Bills: "💡", Shopping: "🛍️", Health: "💊", Fun: "🎬", Other: "📦" },
                   income: { Salary: "💼", Freelance: "🧑‍💻", Gift: "🎁", Other: "💰" } };
    const KEY = "spendly.tx";
    const fmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 0 });
    const $ = (s) => document.querySelector(s);
    let type = "expense";
    let tx = load();

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) ?? seed(); } catch { return seed(); }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(tx)); } catch {} }
    function seed() {
      const d = (n) => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
      return [
        { id: 1, type: "income", desc: "Monthly salary", amount: 150000, category: "Salary", date: d(6) },
        { id: 2, type: "expense", desc: "Groceries", amount: 18500, category: "Food", date: d(5) },
        { id: 3, type: "expense", desc: "Electricity bill", amount: 12400, category: "Bills", date: d(4) },
        { id: 4, type: "expense", desc: "Careem rides", amount: 4200, category: "Transport", date: d(3) },
        { id: 5, type: "income", desc: "Logo design project", amount: 25000, category: "Freelance", date: d(2) },
        { id: 6, type: "expense", desc: "New shoes", amount: 9800, category: "Shopping", date: d(1) },
        { id: 7, type: "expense", desc: "Cinema", amount: 2600, category: "Fun", date: d(0) },
      ];
    }
    const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const thisMonth = (t) => t.date.slice(0, 7) === new Date().toISOString().slice(0, 7);

    function setType(t) {
      type = t;
      document.querySelectorAll(".toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.type === t)));
      $("#category").innerHTML = Object.entries(CATS[t]).map(([k, e]) => `<option value="${k}">${e} ${k}</option>`).join("");
    }

    function render() {
      const balance = tx.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0);
      const month = tx.filter(thisMonth);
      const inc = month.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
      const exp = month.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
      $("#balance").textContent = fmt.format(balance);
      $("#balance").className = "value " + (balance < 0 ? "expense" : "");
      $("#income").textContent = fmt.format(inc);
      $("#expense").textContent = fmt.format(exp);

      const byCat = {};
      month.filter(t => t.type === "expense").forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
      const max = Math.max(1, ...Object.values(byCat));
      const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      $("#bars").innerHTML = rows.length ? rows.map(([c, v]) => `
        <div class="bar"><span>${CATS.expense[c] || "📦"} ${c}</span><div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div><span class="amount">${fmt.format(v)}</span></div>`).join("")
        : `<p class="muted">No expenses this month yet.</p>`;

      const q = $("#search").value.trim().toLowerCase(), f = $("#filter").value;
      const shown = tx.filter(t => (f === "all" || t.type === f) && (!q || t.desc.toLowerCase().includes(q) || t.category.toLowerCase().includes(q)))
                      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
      $("#list").innerHTML = shown.length ? shown.map(t => `
        <li class="tx">
          <span class="icon" aria-hidden="true">${CATS[t.type][t.category] || "📦"}</span>
          <span><strong>${esc(t.desc)}</strong><br><span class="muted">${t.category} · ${new Date(t.date + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span></span>
          <span class="amount ${t.type}">${t.type === "income" ? "+" : "−"}${fmt.format(t.amount)}</span>
          <button class="del" data-id="${t.id}" aria-label="Delete ${esc(t.desc)}">✕</button>
        </li>`).join("")
        : `<li class="empty">${tx.length ? "No transactions match your search." : "No transactions yet — add your first one."}</li>`;
    }

    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const desc = $("#desc").value.trim(), amount = parseFloat($("#amount").value), date = $("#date").value;
      if (!desc) return ($("#error").textContent = "Please add a description.");
      if (!(amount > 0)) return ($("#error").textContent = "Amount must be greater than 0.");
      if (!date) return ($("#error").textContent = "Please pick a date.");
      $("#error").textContent = "";
      tx.push({ id: Date.now(), type, desc, amount: Math.round(amount * 100) / 100, category: $("#category").value, date });
      save(); render();
      $("#desc").value = ""; $("#amount").value = ""; $("#desc").focus();
    });
    document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => setType(b.dataset.type)));
    $("#list").addEventListener("click", (e) => { const b = e.target.closest(".del"); if (b) { tx = tx.filter(t => t.id !== +b.dataset.id); save(); render(); } });
    $("#search").addEventListener("input", render);
    $("#filter").addEventListener("change", render);
    $("#exportBtn").addEventListener("click", () => {
      const rows = [["date", "type", "description", "category", "amount"], ...tx.map(t => [t.date, t.type, t.desc, t.category, t.amount])];
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })), download: "spendly.csv" });
      a.click(); URL.revokeObjectURL(a.href);
    });

    $("#date").value = new Date().toISOString().slice(0, 10);
    setType("expense");
    render();
  </script>
</body>
</html>
